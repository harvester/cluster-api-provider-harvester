name: release

on:
  push:
    branches:
    - "main"
    - "v*"
    tags:
    - "v*.*.*"
  # Clean re-trigger path when a tag push fails to start the workflow: with
  # immutable releases, deleting and re-pushing a tag is no longer an option.
  workflow_dispatch: {}

env:
  IMAGE_NAME: cluster-api-provider-harvester
  TAG: ${{ github.ref_name }}
  ORG: ${{ github.repository_owner }}

permissions:
  contents: read

jobs:
  build:
    name: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Read Prime Registry credentials
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # v3
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;

    - name: Read staging registry credentials
      if: ${{ startsWith(github.ref, 'refs/heads/') }}
      uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # v3
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | STAGING_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | STAGING_REGISTRY_PASSWORD ;

    - name: Select image registry
      id: registry
      env:
        PRIME_REGISTRY: ${{ env.PRIME_REGISTRY }}
        STAGING_REGISTRY: ${{ env.STAGING_REGISTRY }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "name=$PRIME_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "chart_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pull_policy=IfNotPresent" >> "$GITHUB_OUTPUT"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
        else
          echo "name=$STAGING_REGISTRY" >> "$GITHUB_OUTPUT"
          # helm charts need to follow semver, so staging chart pushes are always versioned v0.1.0-branch-head
          echo "chart_tag=v0.1.0-${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}-head" >> "$GITHUB_OUTPUT"
          echo "pull_policy=Always" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}-head" >> "$GITHUB_OUTPUT"
        fi

    - name: Docker login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ steps.registry.outputs.name }}
        username: ${{ startsWith(github.ref, 'refs/tags/') && env.PRIME_REGISTRY_USERNAME || env.STAGING_REGISTRY_USERNAME }}
        password: ${{ startsWith(github.ref, 'refs/tags/') && env.PRIME_REGISTRY_PASSWORD || env.STAGING_REGISTRY_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ steps.registry.outputs.name }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}

    - name: Build and push
      id: build
      run: |
        REGISTRY=${name} CHART_TAG=${chart_tag} PULL_POLICY=${pull_policy} TAG=${image_tag} make docker-build-all
        REGISTRY=${name} CHART_TAG=${chart_tag} PULL_POLICY=${pull_policy} TAG=${image_tag} make docker-push-all
        # publish commands accepts docker login credentials as OCI_USERNAME and OCI_PASSWORD
        export OCI_USERNAME=${oci_username}
        export OCI_PASSWORD=${oci_password}
        REGISTRY=${name} CHART_TAG=${chart_tag} PULL_POLICY=${pull_policy} TAG=${image_tag} make docker-push-chart
        # Fetch and export the top-level multi-arch manifest digest
        MANIFEST_DIGEST=$(docker buildx imagetools inspect "$name/${{ env.ORG }}/${{ env.IMAGE_NAME }}:$image_tag" --format '{{.Manifest.Digest}}')

        echo "Multi-arch Manifest Digest: $MANIFEST_DIGEST"
        echo  "digest=$MANIFEST_DIGEST" >> "$GITHUB_OUTPUT" 
      env:
        name: ${{ steps.registry.outputs.name }}
        chart_tag: ${{ steps.registry.outputs.chart_tag }}
        pull_policy: ${{ steps.registry.outputs.pull_policy }}
        image_tag: ${{ steps.registry.outputs.image_tag }}
        oci_username: ${{ startsWith(github.ref, 'refs/tags/') && env.PRIME_REGISTRY_USERNAME || env.STAGING_REGISTRY_USERNAME }}
        oci_password: ${{ startsWith(github.ref, 'refs/tags/') && env.PRIME_REGISTRY_PASSWORD || env.STAGING_REGISTRY_PASSWORD }}

    - name: Sign container image with cosign (keyless OIDC)
      env:
        IMAGE: ${{ steps.registry.outputs.name }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: cosign sign  --oidc-provider=github-actions --yes "${IMAGE}@${DIGEST}"

    - name: Generate SLSA build provenance attestation
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: ${{ steps.registry.outputs.name }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true


  release:
    name: github-release
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Publishing must be the very last step of the workflow: once published the
    # release becomes immutable (assets and tag frozen), so everything that
    # belongs to it must exist beforehand.
    needs: [build]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Update manifests
      run: |
        make release-manifests
    - name: Create draft GitHub Release and publish it (final, immutable from here)
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Determine if the tag requires a prerelease flag
        if [[ "${{ github.ref_name }}" == *"dev"* || "${{ github.ref_name }}" == *"rc"* ]]; then
          EXTRA_FLAGS="--prerelease"
        else
          EXTRA_FLAGS=""
        fi
        # gh release view also resolves drafts: only a published release counts.
        if [ "$(gh release view ${{ github.ref_name }} --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
          echo "${{ github.ref_name }} is already published (immutable), nothing to do"
          exit 0
        fi
        # Drafts are not resolvable by tag; a stale one left by a failed run may
        # miss assets, so drop it and recreate the draft in a known-good state.
        lookup_draft() {
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == "${{ github.ref_name }}") | .id' | head -1
        }
        STALE_ID=$(lookup_draft)
        if [ -n "$STALE_ID" ]; then
          gh api -X DELETE repos/${{ github.repository }}/releases/$STALE_ID
        fi
        gh release create ${{ github.ref_name }} --draft --generate-notes $EXTRA_FLAGS \
          out/cluster-template.yaml out/cluster-template-dhcp.yaml \
          out/clusterclass-harvester-rke2.yaml
        # The list API lags slightly behind the creation: retry the id lookup.
        DRAFT_ID=""
        for _ in $(seq 1 10); do
          DRAFT_ID=$(lookup_draft)
          [ -n "$DRAFT_ID" ] && break
          sleep 3
        done
        [ -n "$DRAFT_ID" ] || { echo "draft not found after creation"; exit 1; }
        gh api -X PATCH repos/${{ github.repository }}/releases/$DRAFT_ID -F draft=false > /dev/null
        echo "Release ${{ github.ref_name }} published"
