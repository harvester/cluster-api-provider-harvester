          spec:
            description: HarvesterMachineSpec defines the desired state of HarvesterMachine.
            properties:
              cpu:
                description: CPU is the number of CPU to assign to the VM.
                format: int32
                type: integer
              failureDomain:
                description: FailureDomain defines the zone or failure domain where
                  this VM should be.
                type: string
              firmware:
                description: |-
                  Firmware selects the firmware used to boot the VM. When unset, the VM
                  keeps booting with the current default (BIOS).
                properties:
                  efi:
                    description: EFI boots the VM with UEFI firmware instead of the
                      default BIOS.
                    type: boolean
                  secureBoot:
                    description: |-
                      SecureBoot enables UEFI Secure Boot: the VM boots with
                      SecureBoot-enabled OVMF ROMs and the SMM CPU feature is turned on.
                      Requires efi to be true. The guest image must carry a signed bootloader.
                    type: boolean
                type: object
              memory:
                description: Memory is the memory size to assign to the VM (should
                  be similar to pod.spec.containers.resources.limits).
                type: string
              networkConfig:
                description: |-
                  NetworkConfig is the static network configuration for this specific machine.
                  If set, this takes precedence over the cluster-level VMNetworkConfig IP pool allocation.
